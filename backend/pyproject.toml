[project]
name = "ai-research-engine-backend"
version = "0.1.0"
description = "Backend scaffold for Step 1 of the AI Research Engine pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "feedparser>=6.0.11",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0,<2.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
